name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: vitest + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Type check
        run: npx tsc --noEmit

      # DX-32: non-blocking on purpose — this is the first run wiring lint
      # into CI at all, and the existing backlog hasn't been triaged yet.
      # Flip continue-on-error to false (making lint required) once that
      # backlog is cleared; don't try to fix it all in one PR before then.
      - name: Lint
        run: npm run lint
        continue-on-error: true
