name: sentry-fixer

# Triggered by the /api/internal/sentry-trigger Vercel route when a
# Sentry alert fires. The route validates the Sentry webhook
# signature and then dispatches this workflow with the full event
# JSON as input.
#
# Also runnable manually from the Actions tab — paste a Sentry
# event JSON into the `sentry_event` input and the workflow will
# behave identically. Useful for retrying failed runs or replaying
# historical events.
#
# Costs $$ on every run — Claude Agent SDK calls bill against the
# repo's ANTHROPIC_API_KEY secret. The 30-minute hard cap inside
# scripts/sentry-fixer.ts is the second line of defense; the
# `timeout-minutes` here is the outer fence.

on:
  workflow_dispatch:
    inputs:
      sentry_event:
        description: Sentry event payload as JSON
        required: true
        type: string
      event_id:
        description: Sentry event id (used to name the branch)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # App secrets needed for the agent's e2e tests.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The agent commits + pushes its fix branch. Default
          # GITHUB_TOKEN scoped by `permissions:` above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Configure git for the agent
        run: |
          git config user.name "sentry-fixer[bot]"
          git config user.email "sentry-fixer@users.noreply.github.com"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run agent
        # Pipe the event JSON over stdin to dodge shell-escaping.
        # Streaming stdout becomes the workflow log + audit trail.
        #
        # Auth selection: the SDK prefers ANTHROPIC_API_KEY when both
        # auth env vars are present. We invert that here — if the
        # subscription-backed OAuth token is configured, use ONLY
        # that and explicitly unset ANTHROPIC_API_KEY for this step.
        # The shell `${VAR:+...}` syntax means "if VAR is set + non-
        # empty"; if OAuth isn't set, we fall through to API key.
        run: |
          # Strip whitespace + newlines from the auth tokens before
          # the SDK uses them. Pasted secrets often carry a trailing
          # \n from terminal output; HTTP headers can't contain
          # whitespace and the SDK rejects them with a cryptic
          # "Header has invalid value" error.
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
            export CLAUDE_CODE_OAUTH_TOKEN
            unset ANTHROPIC_API_KEY
            echo "[auth] using CLAUDE_CODE_OAUTH_TOKEN (len=${#CLAUDE_CODE_OAUTH_TOKEN})"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
            export ANTHROPIC_API_KEY
            echo "[auth] using ANTHROPIC_API_KEY (len=${#ANTHROPIC_API_KEY})"
          else
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set"
            exit 1
          fi
          echo "$SENTRY_EVENT" | npx tsx scripts/sentry-fixer.ts
        env:
          SENTRY_EVENT: ${{ inputs.sentry_event }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # gh CLI reads GH_TOKEN / GITHUB_TOKEN from env to
          # authenticate.
          #
          # GITHUB_TOKEN (the workflow's auto-injected token) can push
          # branches but is blocked by GitHub's "GitHub Actions is not
          # permitted to create or approve pull requests" policy when
          # the agent runs `gh pr create`. The org-level setting that
          # would let it bypass this is sometimes auto-disabled or
          # overridden by parent-org policy.
          #
          # GH_PAT is a fine-grained personal access token (scoped:
          # pull-requests: read+write on this repo only) and is NOT
          # subject to that policy. We prefer it for the agent's
          # `gh` calls; fall back to GITHUB_TOKEN when it's not
          # configured (agent can still push branches; PR creation
          # may fail, in which case the workflow log will say so).
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload agent summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sentry-fixer-${{ inputs.event_id }}
          path: |
            .agent-out/
            test-results/
          # `.agent-out/` is a dot-prefixed directory; upload-artifact
          # treats those as hidden and skips them by default. The
          # smoke run on 2026-05-14 surfaced this — agent wrote the
          # summary fine but the artifact was empty.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
