# Railway deploy config for the CAD execution sidecar.
#
# In the Railway service, set Root Directory to `cad-runner` so this file and
# the Dockerfile next to it are the ones Railway uses (the repo root is the
# Next.js app, which must NOT be built here). With the root directory set,
# everything below is automatic — no manual port or healthcheck wiring.
#
# After it's up, set on the service:
#   CAD_RUNNER_SECRET = <a long random token>   (REQUIRED — also set the same
#                                                 on Vercel; the service fails
#                                                 to boot without it, absent
#                                                 the explicit dev override
#                                                 CAD_RUNNER_ALLOW_NO_AUTH=true)
# and on the Vercel app:
#   CAD_RUNNER_URL    = https://<this-service>.up.railway.app
#   CAD_RUNNER_SECRET = <same token>
# Leave CAD_RUNNER_USE_MOCK unset/false in prod.
#
# Security: this container runs model-generated Python. It needs NO outbound
# network (LLM/fal.ai calls happen from the Next app), so restrict egress on
# the service. Give it generous memory — CAD runs are RAM-hungry. Where Railway
# exposes them, add a read-only root FS + tmpfs /tmp, cap-drop=ALL, and
# no-new-privileges (the Dockerfile keeps all writable paths under /tmp so a
# read-only root works). The container is the trust boundary — see README
# "Security" for the in-process hardening (MTR-187) and what it does/doesn't
# enforce. Optional resource-cap env knobs (all safe defaults): CAD_RUN_*,
# CAD_SESSION_*, CAD_MAX_OUTPUT_BYTES. Prefer CAD_RUNNER_SECRET_FILE over the
# env var so the secret stays out of /proc/*/environ.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
